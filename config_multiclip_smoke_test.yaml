# Two-clip end-to-end smoke test for the connected a2A1920-160ucBAS camera.
# Exercises repeated acquisition, remuxing, scheduling, preview, and metadata.

project: monarch_behavior_multiclip_test
subject: cohort_C01-C04
output_root: ./recordings_test

experiment:
  animal_ids: [C01, C02, C03, C04]
  notes: "Three-clip end-to-end test of repeated acquisition, remuxing, scheduling, preview, and metadata."

ffmpeg: null

archive:
  enabled: false

schedule:
  clip_duration_s: 30
  interval_s: 30
  number_of_clips: 2

encoding:
  codec: libx264
  preset: veryfast
  crf: 25
  gop_seconds: 2

recording_preview:
  enabled: true
  fps: 1
  max_width: 600
  max_height: 720
  show_status: true
  layout: card_panel

review_snapshots:
  enabled: true
  count_per_clip: 10
  jpeg_quality: 95

cameras:
  - label: camera1
    animal_ids: [C01, C02, C03, C04]
    model: a2A1920-160ucBAS
    serial: "40604036"
    fps: 5
    width: 1920
    height: 1200
    offset_x: 0
    offset_y: 0
    binning: 1
    pixel_format: auto
    # output_width: 960
    # Starting exposure used before camera-side auto exposure takes over.
    exposure_us: 30000
    gain: 0
    auto_exposure: true
    auto_exposure_mode: continuous
    auto_exposure_lower_us: 6000
    auto_exposure_upper_us: 180000
    auto_target_brightness: 0.70
    auto_exposure_roi: full
    auto_gain: false
    balance_white_auto: true  # Keep color balance continuous while frames are acquired.
    rotate: 270
    flip_horizontal: false
    flip_vertical: false
    max_num_buffer: 30
