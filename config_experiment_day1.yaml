# Production day-1 config for the connected a2A1920-160ucBAS camera.
# Full native 1920 x 1200 sensor FoV, rotated 90 degrees CCW.

project: monarch_behavior_pilot
subject: cohort_C01-C04_day1
output_root: ./recordings

experiment:
  animal_ids: [C01, C02, C03, C04, C05, C06, C07, C08]
  notes: "One-camera monarch caterpillar pilot. Full 1920 x 1200 sensor FoV, rotated 90 degrees counter-clockwise and downsampled to approximately 960 x 1536."

ffmpeg: null

archive:
  enabled: true
  destination_root: "/Volumes/Dr. Rose/Hung_MBL"
  required_mount_point: "/Volumes/Dr. Rose"
  rsync_executable: /usr/bin/rsync
  transfer_after_each_clip: true
  background_transfer: true
  delete_local_clip_after_verified_transfer: true
  retain_local_session_metadata: true
  verification: checksum
  max_clip_size_gb: 50
  min_local_free_gb_before_clip: 120
  min_external_free_gb_before_transfer: 60
  max_unarchived_clips: 2
  stop_before_next_clip_on_transfer_failure: true

schedule:
  clip_duration_s: 600
  interval_s: 600
  number_of_clips: 30 # do 5 hr now just to check

encoding:
  codec: libx264
  preset: veryfast
  crf: 25
  gop_seconds: 2

recording_preview:
  enabled: true
  fps: 1
  max_width: 600
  max_height: 720
  show_status: true
  layout: card_panel

cameras:
  - label: camera1
    animal_ids: [C01, C02, C03, C04, C05, C06, C07, C08]
    model: a2A1920-160ucBAS
    serial: "40604036"
    fps: 5

    # Full native sensor field of view.
    width: 1920
    height: 1200
    offset_x: 0
    offset_y: 0

    binning: 1
    pixel_format: auto

    # Software downscaling after rotation; preserves the full FoV.
    # output_width: 960 ## don't downsample for now
    # Starting exposure used before camera-side auto exposure takes over.
    exposure_us: 30000
    gain: 0
    auto_exposure: true
    auto_exposure_mode: continuous
    auto_exposure_lower_us: 6000
    auto_exposure_upper_us: 180000
    auto_target_brightness: 0.70
    auto_exposure_roi: full
    auto_gain: false
    balance_white_auto: true  # Keep color balance continuous while frames are acquired.
    rotate: 270
    flip_horizontal: false
    flip_vertical: false
    max_num_buffer: 30
