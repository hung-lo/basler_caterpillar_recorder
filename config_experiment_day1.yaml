# Production day-1 config for the connected a2A1920-160ucBAS camera.
# Full native 1920 x 1200 sensor FoV, rotated 90 degrees CCW.

project: monarch_behavior_pilot
subject: cohort_C01-C04_day1
output_root: ./recordings

experiment:
  animal_ids: [C01, C02, C03, C04]
  notes: "One-camera monarch caterpillar pilot. Full 1920 x 1200 sensor FoV, rotated 90 degrees counter-clockwise and downsampled to approximately 960 x 1536."

ffmpeg: null

schedule:
  clip_duration_s: 3600
  interval_s: 3600
  number_of_clips: 24

encoding:
  codec: libx264
  preset: veryfast
  crf: 25
  gop_seconds: 2

recording_preview:
  enabled: true
  fps: 1
  max_width: 600
  max_height: 720
  show_status: true

cameras:
  - label: camera1
    animal_ids: [C01, C02, C03, C04]
    model: a2A1920-160ucBAS
    serial: "40604036"
    fps: 5

    # Full native sensor field of view.
    width: 1920
    height: 1200
    offset_x: 0
    offset_y: 0

    binning: 1
    pixel_format: auto

    # Software downscaling after rotation; preserves the full FoV.
    output_width: 960
    exposure_us: 5000
    gain: 0
    auto_exposure: false
    auto_gain: false
    balance_white_auto: false
    rotate: 270
    flip_horizontal: false
    flip_vertical: false
    max_num_buffer: 30
