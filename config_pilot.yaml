# Fast-start pilot configuration for the single connected Basler camera.
# Run `python record_basler.py --list-cameras` first, then confirm serial
# 40604036 if the camera ever changes.

project: monarch_behavior_pilot
subject: cohort_pilot01
output_root: ./recordings

experiment:
  animal_ids: [M01, M02, M03, M04, M05, M06, M07]
  outcome_definition: successful_adult_eclosion
  notes: "Pilot: fixed individual enclosures under one full-FoV camera; edit IDs before recording."

# Optional absolute path or command name. Leaving this null uses ffmpeg on PATH.
ffmpeg: null

schedule:
  # Start-to-start scheduling. Equal values make continuous back-to-back clips.
  # The recommended pilot is continuous recording split into 30-minute files.
  clip_duration_s: 1800
  interval_s: 1800
  total_duration_h: 24
  # Alternative to total_duration_h:
  # number_of_clips: 48

encoding:
  codec: libx264
  preset: veryfast
  crf: 25
  gop_seconds: 2

cameras:
  # Full native sensor field of view at 5 fps, rotated 90 degrees CCW and
  # downscaled after rotation to keep file sizes practical.
  - label: camera1
    animal_ids: [M01, M02, M03, M04, M05, M06, M07]
    model: a2A1920-160ucBAS
    serial: "40604036"
    fps: 5
    width: 1920
    height: 1200
    offset_x: 0
    offset_y: 0
    binning: 1
    pixel_format: auto
    # output_width: 960
    exposure_us: 5000
    gain: 0
    auto_exposure: false
    auto_gain: false
    balance_white_auto: false
    rotate: 270
    flip_horizontal: false
    flip_vertical: false
    max_num_buffer: 30
