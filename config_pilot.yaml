# Fast-start pilot configuration for the single connected Basler camera.
# Run `python record_basler.py --list-cameras` first, then confirm serial
# 40604036 if the camera ever changes.

project: monarch_behavior_pilot
subject: cohort_pilot01
output_root: ./recordings

experiment:
  animal_ids: [C01, C02, C03, C04, C05, C06, C07, C08]
  outcome_definition: successful_adult_eclosion
  notes: "Pilot: fixed individual enclosures under one full-FoV camera; edit IDs before recording."

# Optional absolute path or command name. Leaving this null uses ffmpeg on PATH.
ffmpeg: null

archive:
  enabled: true
  destination_root: "/Volumes/Dr. Rose/Hung_MBL"
  required_mount_point: "/Volumes/Dr. Rose"
  rsync_executable: /usr/bin/rsync
  transfer_after_each_clip: true
  background_transfer: true
  delete_local_clip_after_verified_transfer: true
  retain_local_session_metadata: true
  verification: checksum
  max_clip_size_gb: 50
  min_local_free_gb_before_clip: 120
  min_external_free_gb_before_transfer: 60
  max_unarchived_clips: 2
  stop_before_next_clip_on_transfer_failure: true

schedule:
  # Optional one-shot wall-clock start in this computer's local timezone.
  # Omit or leave null to start normally when the recorder is launched.
  # start_at_local: "2026-08-08 05:00"
  # Start-to-start scheduling. Equal values make continuous back-to-back clips.
  # The recommended pilot is continuous recording split into 30-minute files.
  clip_duration_s: 1800
  interval_s: 1800
  total_duration_h: 24
  # Alternative to total_duration_h:
  # number_of_clips: 48

encoding:
  codec: libx264
  preset: veryfast
  crf: 25
  gop_seconds: 2

cameras:
  # Full native sensor field of view at 5 fps, rotated 90 degrees CCW and
  # downscaled after rotation to keep file sizes practical.
  - label: camera1
    animal_ids: [C01, C02, C03, C04, C05, C06, C07, C08]
    model: a2A1920-160ucBAS
    serial: "40604036"
    fps: 5
    width: 1920
    height: 1200
    offset_x: 0
    offset_y: 0
    binning: 1
    pixel_format: auto
    # output_width: 960
    # Starting exposure used before camera-side auto exposure takes over.
    exposure_us: 30000
    gain: 0
    auto_exposure: true
    auto_exposure_mode: continuous
    auto_exposure_lower_us: 6000
    auto_exposure_upper_us: 180000
    auto_target_brightness: 0.70
    auto_exposure_roi: full
    auto_gain: false
    balance_white_auto: true  # Keep color balance continuous while frames are acquired.
    rotate: 270
    flip_horizontal: false
    flip_vertical: false
    max_num_buffer: 30
