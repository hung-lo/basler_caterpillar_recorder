# Three-clip end-to-end archive smoke test for the connected a2A1920-160ucBAS camera.
# Exercises repeated acquisition, remuxing, scheduling, preview, archive transfer, and metadata.

project: monarch_behavior_multiclip_test
subject: cohort_C01-C04
output_root: ./recordings_test

experiment:
  animal_ids: [C01, C02, C03, C04]
  notes: "Three-clip end-to-end test of repeated acquisition, remuxing, scheduling, preview, archive transfer, and metadata."

ffmpeg: null

archive:
  enabled: true
  destination_root: "/Volumes/Dr. Rose/Hung_MBL"
  required_mount_point: "/Volumes/Dr. Rose"
  rsync_executable: /usr/bin/rsync
  transfer_after_each_clip: true
  background_transfer: true
  delete_local_clip_after_verified_transfer: true
  retain_local_session_metadata: true
  verification: checksum
  max_clip_size_gb: 50
  min_local_free_gb_before_clip: 120
  min_external_free_gb_before_transfer: 60
  max_unarchived_clips: 2
  stop_before_next_clip_on_transfer_failure: true

schedule:
  clip_duration_s: 20
  interval_s: 20
  number_of_clips: 3

encoding:
  codec: libx264
  preset: veryfast
  crf: 25
  gop_seconds: 2

recording_preview:
  enabled: true
  fps: 1
  max_width: 600
  max_height: 720
  show_status: true
  layout: card_panel

cameras:
  - label: camera1
    animal_ids: [C01, C02, C03, C04]
    model: a2A1920-160ucBAS
    serial: "40604036"
    fps: 5
    width: 1920
    height: 1200
    offset_x: 0
    offset_y: 0
    binning: 1
    pixel_format: auto
    # output_width: 960
    exposure_us: 5000
    gain: 0
    auto_exposure: false
    auto_gain: false
    balance_white_auto: false
    rotate: 270
    flip_horizontal: false
    flip_vertical: false
    max_num_buffer: 30
