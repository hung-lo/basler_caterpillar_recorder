# Ten-second one-camera end-to-end test using the same camera and encoding settings
# as the day-1 config. Run previews first, then use this before starting the long recording.

project: monarch_behavior_smoke_test
subject: camera_setup
output_root: ./recordings_test

experiment:
  animal_ids: [M01, M02, M03, M04, M05, M06, M07]
  notes: "Ten-second one-camera acquisition and encoder test."
ffmpeg: null

archive:
  enabled: false

schedule:
  clip_duration_s: 10
  interval_s: 10
  number_of_clips: 1

encoding:
  codec: libx264
  preset: veryfast
  crf: 25
  gop_seconds: 2

cameras:
  - label: camera1
    animal_ids: [M01, M02, M03, M04, M05, M06, M07]
    model: a2A1920-160ucBAS
    serial: "40604036"
    fps: 5
    width: 1920
    height: 1200
    offset_x: 0
    offset_y: 0
    binning: 1
    pixel_format: auto
    output_width: 960
    # Starting exposure used before camera-side auto exposure takes over.
    exposure_us: 30000
    gain: 0
    auto_exposure: true
    auto_exposure_mode: continuous
    auto_exposure_lower_us: 6000
    auto_exposure_upper_us: 180000
    auto_target_brightness: 0.70
    auto_exposure_roi: full
    auto_gain: false
    balance_white_auto: true  # Keep color balance continuous while frames are acquired.
    rotate: 270
    flip_horizontal: false
    flip_vertical: false
    max_num_buffer: 30
